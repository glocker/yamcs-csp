services:
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  # Two processors, because libcsp transmit CRC coverage is fixed at build time: each processor releases commands to
  # its own TC link and postprocessor
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: data
      type: data
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: header_data
      type: header_data
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.archive.EventRecorder

mdb:
  - type: xtce
    spec: mdb/csp2.xml

dataLinks:
  - name: csp2_tm
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    port: 10015
    packetPreprocessorClassName: io.github.glocker.yamcscsp.csp2.CspPacketPreprocessor
    packetPreprocessorArgs:
      # 1 is the Yamcs address in the libcsp vectors for the MDB example, 16383 is the largest address
      cspId: [1, 16383]
      crcMode: both
    invalidPackets: DIVERT
    invalidPacketsStream: invalid_tm

  # libcsp frame is at most 262 bytes: 6-byte header and 256-byte packet buffer, which includes the CRC trailer
  - name: csp2_tc_data
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_data
    host: localhost
    port: 10025
    commandPostprocessorClassName: io.github.glocker.yamcscsp.csp2.CspCommandPostprocessor
    commandPostprocessorArgs:
      crcMode: data
      maximumTcPacketLength: 262

  - name: csp2_tc_header_data
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_header_data
    host: localhost
    port: 10026
    commandPostprocessorClassName: io.github.glocker.yamcscsp.csp2.CspCommandPostprocessor
    commandPostprocessorArgs:
      crcMode: header_data
      maximumTcPacketLength: 262

streamConfig:
  tm:
    - name: tm_realtime
      rootContainer: /CSP2/CspPacket
      processor: realtime
  invalidTm: invalid_tm
  tc:
    - tc_realtime
    - tc_data
    - tc_header_data
  cmdHist:
    - cmdhist_realtime
    - cmdhist_dump
  event:
    - events_realtime
    - events_dump
  param:
    - pp_realtime
    - sys_param
    - proc_param
