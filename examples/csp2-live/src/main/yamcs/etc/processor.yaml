realtime:
  services:
    - class: org.yamcs.StreamTmPacketProvider
    - class: org.yamcs.StreamTcCommandReleaser
      args:
        stream: tc_realtime
  config:
    generateEvents: true
    subscribeAll: true
    tmProcessor:
      ignoreOutOfContainerEntries: false

data:
  services:
    - class: org.yamcs.StreamTcCommandReleaser
      args:
        stream: tc_data

header_data:
  services:
    - class: org.yamcs.StreamTcCommandReleaser
      args:
        stream: tc_header_data
